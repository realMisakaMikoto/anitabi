name: Signed APK Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Audit tracked source for credentials
        run: bash .github/scripts/audit-source-secrets.sh
      - name: Restore Firebase Android configuration
        env:
          ANITABI_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANITABI_GOOGLE_SERVICES_JSON_BASE64 }}
        run: bash .github/scripts/restore-google-services.sh --require-real
      - name: Restore release keystore outside the workspace
        env:
          KEYSTORE_BASE64: ${{ secrets.ANITABI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anitabi-release.jks"
      - name: Verify tag matches app version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          expected="${tag_version%%-rc.*}"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Release tag must be vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
          actual="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test "$actual" = "$expected"
      - name: Test and build signed release APK
        env:
          ANITABI_STORE_FILE: ${{ runner.temp }}/anitabi-release.jks
          ANITABI_STORE_PASSWORD: ${{ secrets.ANITABI_STORE_PASSWORD }}
          ANITABI_KEY_ALIAS: ${{ secrets.ANITABI_KEY_ALIAS }}
          ANITABI_KEY_PASSWORD: ${{ secrets.ANITABI_KEY_PASSWORD }}
          ANITABI_NAVIGATION_API_KEY: ${{ secrets.ANITABI_NAVIGATION_API_KEY }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace
      - name: Verify release R8 map reflection contract
        run: bash .github/scripts/audit-navigation-r8.sh
      - name: Audit release APK contents
        run: bash .github/scripts/audit-apk.sh app/build/outputs/apk/release/app-release.apk
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Name artifact and create checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "anitabi-${GITHUB_REF_NAME}.apk"
          sha256sum "anitabi-${GITHUB_REF_NAME}.apk" > "anitabi-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="${tag_version%%-rc.*}"
          notes_file="docs/RELEASE_NOTES_v${app_version}.md"
          test -s "$notes_file"
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *-rc.*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "anitabi-${GITHUB_REF_NAME}.apk" \
            "anitabi-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag \
            --notes-file "$notes_file" \
            --title "$GITHUB_REF_NAME" \
            "${release_flags[@]}"
