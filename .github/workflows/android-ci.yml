name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test, lint and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Audit debug APK contents
        run: bash .github/scripts/audit-apk.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anitabi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-8-api-26
            image: system-images;android-26;google_apis;x86_64
          - label: android-17-api-37
            image: system-images;android-37.0;google_apis;x86_64
    steps:
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v8
        with:
          name: anitabi-debug
          path: apk
      - name: Install emulator system image
        run: sdkmanager "platform-tools" "emulator" "${{ matrix.image }}"
      - name: Create and boot emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" smoke-output
          echo no | avdmanager create avd --force --name anitabi-smoke --package "${{ matrix.image }}"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd anitabi-smoke -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none > smoke-output/emulator.log 2>&1 &
          timeout 180 adb wait-for-device || { cat smoke-output/emulator.log; exit 1; }
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Install and cold-launch app
        run: |
          mkdir -p smoke-output
          adb install -r apk/app-debug.apk
          adb shell am force-stop cn.anitabi.navigator
          adb logcat -c
          adb shell am start -W -n cn.anitabi.navigator/.MainActivity | tee smoke-output/activity-start.txt
          grep -q "Status: ok" smoke-output/activity-start.txt
          adb shell pidof cn.anitabi.navigator | tee smoke-output/process-id.txt
          test -s smoke-output/process-id.txt
          adb shell dumpsys activity activities > smoke-output/activities.txt
          grep -E "mResumedActivity|topResumedActivity" smoke-output/activities.txt | grep -q "cn.anitabi.navigator"
          adb exec-out screencap -p > smoke-output/home.png
          timeout 30 adb shell uiautomator dump /sdcard/window.xml || true
          adb pull /sdcard/window.xml smoke-output/window.xml || true
          adb logcat -d -b crash > smoke-output/crash.log
          ! grep -q "cn.anitabi.navigator" smoke-output/crash.log
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: anitabi-emulator-smoke-${{ matrix.label }}
          path: smoke-output
          if-no-files-found: warn
